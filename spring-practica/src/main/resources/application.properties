# =====================================================================
# StreamList - configuracion de Spring. ESTE ARCHIVO SI SE SUBE A GITHUB:
# no lleva ninguna contrasena. Cada valor ${VARIABLE:defecto} se toma de:
#   - En tu computadora: application-local.properties (no se sube a git).
#   - En Render: las "Environment Variables" del servicio.
# =====================================================================
spring.application.name=spring-practica
spring.config.import=optional:classpath:application-local.properties

# Render asigna el puerto en la variable PORT; en tu computadora es el 80
server.port=${PORT:80}

# ---------------- Base de datos ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/streamlist_practica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Esquema donde se crean las tablas (en Supabase: streamlist, para no exponerlas por su API)
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# Pocas conexiones: el plan gratis de Supabase tiene limite
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# ---------------- Seguridad ----------------
# false = los codigos solo llegan por correo (nunca en la respuesta de la API)
arco.devolver-codigo=${ARCO_DEVOLVER_CODIGO:false}
# false = el CRUD de tablas pide token de administrador
seguridad.modo-practica=${MODO_PRACTICA:false}
# Contrasena de la cuenta de prueba que crea Spring (noelpa847@gmail.com). En Render pon una fuerte.
datos.password-prueba=${PRUEBA_PASSWORD:root}
# Paginas que pueden llamar a esta API desde el navegador (separadas por comas)
cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200,https://paginanoel.online,https://www.paginanoel.online}

